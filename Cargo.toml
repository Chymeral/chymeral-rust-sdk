[package]
name = "chymeral-rust-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust client SDK for the Chymeral Link Protocol"
publish = false
keywords = ["chymeral", "clp", "terminal", "graphics"]
categories = ["api-bindings"]

[dependencies]
interprocess = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }
